<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【電子書】全彩歷險漫畫 阿宅聯盟：決戰AI太陽王國</title>
  
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- 全面使用 Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- 自訂電子書樣式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">

    <!-- 頂部導航列 (Site Header) -->
    <header class="site-header">
      <div class="brand-section">
        <i class="fa-solid fa-sun brand-icon" title="AI太陽王國"></i>
        <h1 class="comic-title">阿宅聯盟：決戰AI太陽王國</h1>
        <span class="series-badge"><i class="fa-solid fa-palette"></i> 全彩歷險漫畫</span>
      </div>

      <div class="header-actions">
        <!-- 適合寬度 / 適合螢幕切換 -->
        <button type="button" class="btn-icon" id="fitToggleBtn" title="切換適合螢幕 / 適合寬度 (快速鍵 W)">
          <i class="fa-solid fa-up-down-left-right" id="fitIcon"></i>
          <span id="fitText">適合螢幕</span>
        </button>

        <!-- 縮放功能 -->
        <button type="button" class="btn-icon" id="zoomOutBtn" title="縮小檢視">
          <i class="fa-solid fa-magnifying-glass-minus"></i>
        </button>
        <button type="button" class="btn-icon" id="zoomResetBtn" title="重設縮放">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button type="button" class="btn-icon" id="zoomInBtn" title="放大檢視">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
        </button>

        <!-- 自動播放 -->
        <button type="button" class="btn-icon" id="playToggleBtn" title="自動翻頁播放">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>

        <!-- 縮圖導覽抽屜按鈕 -->
        <button type="button" class="btn-icon" id="thumbDrawerBtn" title="開啟所有頁面縮圖列表 (快速鍵 T)">
          <i class="fa-solid fa-table-cells"></i>
        </button>

        <!-- 全螢幕切換 -->
        <button type="button" class="btn-icon" id="fullscreenBtn" title="全螢幕切換 (快速鍵 F)">
          <i class="fa-solid fa-expand" id="fullscreenIcon"></i>
        </button>

        <!-- 快速鍵說明 -->
        <button type="button" class="btn-icon" id="helpBtn" title="操作說明與快速鍵">
          <i class="fa-solid fa-circle-question"></i>
        </button>
      </div>
    </header>

    <!-- 漫畫主要閱讀區 (Reader Viewport) -->
    <main class="reader-viewport" id="readerViewport">
      <!-- 左右懸浮翻頁按鈕 -->
      <button type="button" class="floating-nav-btn floating-prev" id="floatingPrevBtn" title="上一頁 (←)">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <!-- 舞台容器 (漫畫畫面呈現) -->
      <div class="comic-stage" id="comicStage"></div>

      <!-- 右側懸浮翻頁按鈕 -->
      <button type="button" class="floating-nav-btn floating-next" id="floatingNextBtn" title="下一頁 (→)">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <!-- 載入中動畫指示器 -->
      <div class="loading-indicator" id="loadingIndicator">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span>精彩內容載入中...</span>
      </div>
    </main>

    <!-- 底部控制列與版權宣告 (Footer) -->
    <footer class="site-footer">
      <div class="control-bar">
        <!-- 翻頁按鈕群組 -->
        <div class="nav-buttons-group">
          <button type="button" class="btn-icon" id="firstBtn" title="前往第一頁 (Home)">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button type="button" class="btn-icon" id="prevBtn" title="上一頁 (←)">
            <i class="fa-solid fa-chevron-left"></i>
            <span>上一頁</span>
          </button>
          <button type="button" class="btn-icon" id="nextBtn" title="下一頁 (→ / 空白鍵)">
            <span>下一頁</span>
            <i class="fa-solid fa-chevron-right"></i>
          </button>
          <button type="button" class="btn-icon" id="lastBtn" title="前往最後一頁 (End)">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <!-- 進度條與頁碼顯示 -->
        <div class="progress-section">
          <input type="range" class="page-slider" id="pageRange" min="1" max="122" value="1" title="滑動跳轉頁數">
        </div>

        <!-- 頁碼跳轉輸入表單 -->
        <form class="page-indicator-form" id="jumpForm">
          <span>第 <strong id="pageDisplay" style="color: var(--accent-sun);">1</strong> 頁</span>
          <span id="totalPageText">/ 122</span>
          <input type="number" class="page-input" id="pageInput" min="1" max="122" value="1" title="輸入頁碼">
          <button type="submit" class="btn-jump" title="跳轉到該頁">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
          </button>
        </form>
      </div>

      <!-- 頁面下方版權宣告 (嚴格依使用者指定格式) -->
      <div class="copyright-notice">
        <i class="fa-regular fa-copyright"></i>
        <span>Copyright © Liyuchiutiger Gongminshen</span>
      </div>
    </footer>

    <!-- 吉祥物元件 (左下角出現、懸停霓虹彩色發光抖動、可任意拖曳移動) -->
    <div class="mascot-container" id="mascotWidget" title="我是吉祥物！可以拖曳我到任何位置喔！">
      <div class="mascot-bubble" id="mascotBubble">嗨！你可以隨意拖曳我到任何地方喔！</div>
      <img src="image/LiyuChillGuy.svg" alt="阿宅聯盟吉祥物" class="mascot-avatar" id="mascotImg" draggable="false">
    </div>

    <!-- 縮圖導覽抽屜 (Thumbnail Drawer) -->
    <aside class="thumb-drawer" id="thumbDrawer">
      <div class="thumb-header">
        <span><i class="fa-solid fa-images"></i> 跨頁縮圖導覽</span>
        <button type="button" class="btn-icon" id="closeThumbBtn" title="關閉縮圖列">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="thumb-grid" id="thumbGrid"></div>
    </aside>

    <!-- 說明與快速鍵彈窗 (Help Modal) -->
    <div class="modal-overlay" id="helpModal">
      <div class="modal-content">
        <div class="modal-header">
          <span><i class="fa-solid fa-keyboard"></i> 閱讀器操作指南與快捷鍵</span>
          <button type="button" class="btn-icon" id="closeHelpBtn" title="關閉">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="shortcut-list">
            <div class="shortcut-item">
              <span>下一頁</span>
              <div class="shortcut-keys"><kbd>→</kbd> <kbd>PageDown</kbd> <kbd>Space</kbd></div>
            </div>
            <div class="shortcut-item">
              <span>上一頁</span>
              <div class="shortcut-keys"><kbd>←</kbd> <kbd>PageUp</kbd></div>
            </div>
            <div class="shortcut-item">
              <span>跳至第一頁 / 最後一頁</span>
              <div class="shortcut-keys"><kbd>Home</kbd> / <kbd>End</kbd></div>
            </div>
            <div class="shortcut-item">
              <span>切換全螢幕</span>
              <div class="shortcut-keys"><kbd>F</kbd></div>
            </div>
            <div class="shortcut-item">
              <span>切換適合模式</span>
              <div class="shortcut-keys"><kbd>W</kbd></div>
            </div>
            <div class="shortcut-item">
              <span>開啟 / 關閉縮圖列表</span>
              <div class="shortcut-keys"><kbd>T</kbd></div>
            </div>
            <div class="shortcut-item">
              <span>手機觸控操作</span>
              <div class="shortcut-keys"><kbd>向左滑下一頁</kbd> <kbd>向右滑上一頁</kbd></div>
            </div>
            <div class="shortcut-item">
              <span>吉祥物互動</span>
              <div class="shortcut-keys"><kbd>滑鼠懸停霓虹彩色發光抖動</kbd> <kbd>可隨意拖曳移動</kbd></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- 載入腳本 -->
  <script src="js/comic-data.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
